<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WTW CyberHub Quiz</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: #faf5ff; /* Soft WTW Tint */
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      padding: 26px 20px;
      border-radius: 18px;
      box-shadow: 0 10px 25px -5px rgba(112, 32, 130, 0.08);
      border: 1px solid #f3e8ff;
    }
    h2 { font-size: 1.3rem; margin: 0 0 14px; text-align: center; font-weight: 700; color: #702082; }
    
    input[type="text"] {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1.5px solid #d8b4fe;
      font-size: 1rem;
      margin-bottom: 14px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #702082; }

    button.primary-btn {
      width: 100%;
      padding: 16px;
      background: #702082;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .options-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .opt-btn {
      width: 100%;
      padding: 16px 18px;
      font-size: 1rem;
      font-weight: 600;
      color: #1e293b;
      background: #fdf4ff;
      border: 1.5px solid #f5d0fe;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .opt-btn:active { background: #fae8ff; transform: scale(0.98); }

    /* Answer feedback alerts */
    .feedback-banner {
      display: none;
      padding: 14px 16px;
      border-radius: 12px;
      margin-top: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      font-weight: 600;
      text-align: center;
    }
    .feedback-correct {
      background: #ecfdf5;
      color: #065f46;
      border: 1.5px solid #a7f3d0;
    }
    .feedback-incorrect {
      background: #fffbeb;
      color: #92400e;
      border: 1.5px solid #fde68a;
    }

    /* Score Summary View */
    .score-circle {
      width: 110px;
      height: 110px;
      background: #702082;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 800;
      margin: 16px auto;
      box-shadow: 0 4px 14px rgba(112, 32, 130, 0.3);
    }
    .score-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.88rem;
    }
    .status-badge {
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
    }
    .badge-correct { background: #dcfce7; color: #15803d; }
    .badge-wrong { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

  <!-- Screen 1: Name Input -->
  <div class="card" id="name-screen">
    <h2>WTW CyberHub Quiz</h2>
    <p style="text-align: center; color: #64748b; font-size: 0.9rem; margin-top: -6px;">Enter your name to participate</p>
    <input type="text" id="username-input" placeholder="Full Name" />
    <button class="primary-btn" onclick="saveName()">Join Session</button>
  </div>

  <!-- Screen 2: Live Question & Answering -->
  <div class="card" id="poll-screen" style="display: none;">
    <div style="font-size: 0.75rem; color: #702082; font-weight: 700; margin-bottom: 4px; text-transform: uppercase;">CyberHub Question</div>
    <h2 id="mobile-q-text" style="color: #0f172a; text-align: left;">Waiting for host...</h2>
    
    <div class="options-list" id="options-box"></div>

    <!-- Correct Prompt -->
    <div id="feedback-correct" class="feedback-banner feedback-correct">
      🎉 Congratulations! That is the correct answer!
    </div>

    <!-- Incorrect / CyberHub Policy Review Prompt -->
    <div id="feedback-incorrect" class="feedback-banner feedback-incorrect">
      ⚠️ That's not quite right. Please review our cybersecurity policies and incident guidance in <strong>CyberHub</strong>.
    </div>
  </div>

  <!-- Screen 3: Final Participant Scorecard -->
  <div class="card" id="summary-screen" style="display: none;">
    <h2>Your Final Results</h2>
    <p style="text-align: center; color: #64748b; font-size: 0.9rem; margin-top: -6px;">Quiz Completed</p>
    
    <div class="score-circle" id="user-score-badge">0/10</div>
    <p id="score-comment" style="text-align: center; font-weight: 600; color: #702082; margin-bottom: 20px;"></p>

    <div id="score-details" style="max-height: 250px; overflow-y: auto; border: 1px solid #f1f5f9; border-radius: 8px;"></div>
  </div>

  <script>
    // 1. FIREBASE CONFIGURATION
    const firebaseConfig = { databaseURL: "https://wtw-quizroadshow2026-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. QUESTIONS (EXACT MATCH WITH INDEX.HTML)
    const questions = [
      {
        q: "What is the primary entry point for 90% of enterprise breaches?",
        options: ["Phishing Emails", "Zero-day Exploits", "Brute Force RDP", "Compromised USBs"],
        correctIndex: 0
      },
      {
        q: "Which cloud architecture pattern provides the strongest isolation?",
        options: ["Multi-Tenant Shared", "Single-Tenant VPC", "Serverless Functions", "Shared Database"],
        correctIndex: 1
      },
      {
        q: "What is the recommended frequency for rotating privileged service account keys?",
        options: ["Every 30-90 Days", "Once a Year", "Only on Breach", "Never if Complex"],
        correctIndex: 0
      },
      {
        q: "Which protocol is the modern standard for passwordless authentication?",
        options: ["FIDO2 / WebAuthn", "Kerberos", "NTLMv2", "SAML 1.1"],
        correctIndex: 0
      },
      {
        q: "Where should automated DAST security scanning run in your pipeline?",
        options: ["Staging Deployment", "Local Developer Machine", "Directly in Production", "Only Post-Incident"],
        correctIndex: 0
      },
      {
        q: "Which vulnerability type bypasses client-side firewalls to query internal servers?",
        options: ["SSRF (Server-Side)", "Cross-Site Scripting (XSS)", "SQL Injection", "Path Traversal"],
        correctIndex: 0
      },
      {
        q: "What is our team's biggest operational focus this quarter?",
        options: ["Cloud Security Posture", "CI/CD Pipeline Speed", "Mobile App UI", "API Modernization"],
        correctIndex: 0
      },
      {
        q: "What is the best defense against API authorization bypass (BOLA/IDOR)?",
        options: ["Object-Level Checks", "Basic HTTP Auth", "Obscure Query IDs", "WAF Rules Only"],
        correctIndex: 0
      },
      {
        q: "Which primary language should our automation team standardize on?",
        options: ["PowerShell", "Python", "Go", "TypeScript"],
        correctIndex: 0
      },
      {
        q: "Where should employees review WTW security policies and incident steps?",
        options: ["CyberHub", "External Forums", "Personal Notes", "Unverified Wiki"],
        correctIndex: 0
      }
    ];

    let currentQIndex = -1;
    let userName = localStorage.getItem("quiz_userName") || "";

    if (userName) showPollScreen();

    function saveName() {
      const input = document.getElementById("username-input").value.trim();
      if (!input) return alert("Please enter your name.");
      userName = input;
      localStorage.setItem("quiz_userName", userName);
      showPollScreen();
    }

    function showPollScreen() {
      document.getElementById("name-screen").style.display = "none";
      document.getElementById("poll-screen").style.display = "block";
      document.getElementById("summary-screen").style.display = "none";
      listenToHost();
    }

    function listenToHost() {
      db.ref("session/activeQuestion").on("value", snapshot => {
        const qIndex = snapshot.val();
        if (qIndex === null || qIndex === undefined) return;

        // Reset user local cache if host restarts from Q1
        if (qIndex === 0) {
          for (let i = 0; i < questions.length; i++) {
            localStorage.removeItem(`quiz_voted_q_${i}`);
          }
        }

        // Show individual Score Summary if host finished the presentation
        if (qIndex === "finished") {
          renderPersonalSummary();
          return;
        }

        document.getElementById("poll-screen").style.display = "block";
        document.getElementById("summary-screen").style.display = "none";

        currentQIndex = qIndex;
        renderQuestion(qIndex);
      });
    }

    function renderQuestion(idx) {
      const q = questions[idx];
      document.getElementById("mobile-q-text").innerText = q.q;

      const fbCorrect = document.getElementById("feedback-correct");
      const fbIncorrect = document.getElementById("feedback-incorrect");
      fbCorrect.style.display = "none";
      fbIncorrect.style.display = "none";

      const box = document.getElementById("options-box");
      box.innerHTML = "";

      const savedAnswer = localStorage.getItem(`quiz_voted_q_${idx}`);

      q.options.forEach((opt, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.innerText = opt;

        if (savedAnswer) {
          btn.disabled = true;
          if (opt === savedAnswer) {
            btn.style.borderColor = "#702082";
            btn.style.background = "#fae8ff";
            btn.innerText = `● ${opt}`;
          } else {
            btn.style.opacity = "0.5";
          }
        } else {
          btn.onclick = () => submitVote(idx, opt, optIdx);
        }
        box.appendChild(btn);
      });

      // Restore feedback banner if already voted
      if (savedAnswer) {
        const isCorrect = (savedAnswer === q.options[q.correctIndex]);
        if (isCorrect) fbCorrect.style.display = "block";
        else fbIncorrect.style.display = "block";
      }
    }

    function submitVote(qIdx, selectedOption, optIdx) {
      const isCorrect = (optIdx === questions[qIdx].correctIndex);

      // Record in Firebase
      const responseRef = db.ref(`session/responses/q${qIdx}`).push();
      responseRef.set({
        userName: userName,
        answer: selectedOption,
        isCorrect: isCorrect,
        timestamp: Date.now()
      });

      // Save user answer locally
      localStorage.setItem(`quiz_voted_q_${qIdx}`, selectedOption);

      // Show immediate feedback banners
      if (isCorrect) {
        document.getElementById("feedback-correct").style.display = "block";
      } else {
        document.getElementById("feedback-incorrect").style.display = "block";
      }

      renderQuestion(qIdx);
    }

    // Displays the individual participant score when the quiz wraps up
    function renderPersonalSummary() {
      document.getElementById("poll-screen").style.display = "none";
      document.getElementById("summary-screen").style.display = "block";

      let score = 0;
      const detailsBox = document.getElementById("score-details");
      detailsBox.innerHTML = "";

      questions.forEach((q, idx) => {
        const userAnswer = localStorage.getItem(`quiz_voted_q_${idx}`);
        const correctAnswer = q.options[q.correctIndex];
        const isCorrect = (userAnswer === correctAnswer);

        if (isCorrect) score++;

        const item = document.createElement("div");
        item.className = "score-item";
        item.innerHTML = `
          <div>
            <strong>Q${idx + 1}</strong>: ${userAnswer ? userAnswer : '<em>Not answered</em>'}
          </div>
          <span class="status-badge ${isCorrect ? 'badge-correct' : 'badge-wrong'}">
            ${isCorrect ? 'Correct' : 'Review CyberHub'}
          </span>
        `;
        detailsBox.appendChild(item);
      });

      document.getElementById("user-score-badge").innerText = `${score}/${questions.length}`;

      let comment = "";
      if (score >= 9) comment = "Excellent work! Security champion level!";
      else if (score >= 6) comment = "Good effort! Check CyberHub for a quick refresher.";
      else comment = "Please visit CyberHub to review our cybersecurity policies.";

      document.getElementById("score-comment").innerText = comment;
    }
  </script>
</body>
</html>
