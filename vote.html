<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WTW CyberHub Quiz</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: #faf5ff;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      padding: 24px 20px;
      border-radius: 18px;
      box-shadow: 0 10px 25px -5px rgba(112, 32, 130, 0.08);
      border: 1px solid #f3e8ff;
    }
    h2 { font-size: 1.25rem; margin: 0 0 14px; text-align: center; font-weight: 700; color: #702082; }
    
    input[type="text"] {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1.5px solid #d8b4fe;
      font-size: 1rem;
      margin-bottom: 14px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #702082; }

    button.primary-btn {
      width: 100%;
      padding: 16px;
      background: #702082;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Timers Display Header */
    .timer-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f3e8ff;
    }
    .question-timer-pill {
      background: #fdf4ff;
      border: 1.5px solid #d8b4fe;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #702082;
    }
    .total-timer-pill {
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
    }

    .options-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .opt-btn {
      width: 100%;
      padding: 15px 18px;
      font-size: 0.98rem;
      font-weight: 600;
      color: #1e293b;
      background: #fdf4ff;
      border: 1.5px solid #f5d0fe;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      line-height: 1.35;
      transition: all 0.15s ease;
    }
    .opt-btn:active { background: #fae8ff; transform: scale(0.98); }

    .feedback-banner {
      display: none;
      padding: 14px 16px;
      border-radius: 12px;
      margin-top: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      font-weight: 600;
      text-align: center;
    }
    .feedback-correct {
      background: #ecfdf5;
      color: #065f46;
      border: 1.5px solid #a7f3d0;
    }
    .feedback-incorrect {
      background: #fffbeb;
      color: #92400e;
      border: 1.5px solid #fde68a;
    }

    .voter-next-btn {
      display: none;
      width: 100%;
      padding: 15px;
      margin-top: 16px;
      background: #702082;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .score-circle {
      width: 110px;
      height: 110px;
      background: #702082;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 800;
      margin: 16px auto;
      box-shadow: 0 4px 14px rgba(112, 32, 130, 0.3);
    }
    .score-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.88rem;
    }
    .status-badge {
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
    }
    .badge-correct { background: #dcfce7; color: #15803d; }
    .badge-wrong { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

  <!-- Screen 1: Registration -->
  <div class="card" id="name-screen">
    <h2>WTW CyberHub Quiz</h2>
    <p style="text-align: center; color: #64748b; font-size: 0.9rem; margin-top: -6px;">Enter your name to begin (15s / Q | 2m Total)</p>
    <input type="text" id="username-input" placeholder="Full Name" />
    <button class="primary-btn" onclick="saveName()">Start Quiz</button>
  </div>

  <!-- Screen 2: Timed Voting Session -->
  <div class="card" id="poll-screen" style="display: none;">
    <div class="timer-container">
      <div class="question-timer-pill" id="question-timer-label">⏱ 15s remaining</div>
      <div class="total-timer-pill" id="total-timer-label">Total: 02:00</div>
    </div>

    <div style="font-size: 0.75rem; color: #702082; font-weight: 700; margin-bottom: 4px; text-transform: uppercase;" id="mobile-q-tag">CyberHub Question 1 of 8</div>
    <h2 id="mobile-q-text" style="color: #0f172a; text-align: left; line-height: 1.35;">Loading Question...</h2>
    
    <div class="options-list" id="options-box"></div>

    <div id="feedback-correct" class="feedback-banner feedback-correct">
      🎉 Congratulations! That is the correct answer!
    </div>

    <div id="feedback-incorrect" class="feedback-banner feedback-incorrect">
      ⚠️ That's not quite right. Review policies in <strong>CyberHub</strong>.
    </div>

    <button id="voter-next-btn" class="voter-next-btn" onclick="goToNextQuestion()">Next Question →</button>
  </div>

  <!-- Screen 3: Individual Results -->
  <div class="card" id="summary-screen" style="display: none;">
    <h2>Your Final Results</h2>
    <p style="text-align: center; color: #64748b; font-size: 0.9rem; margin-top: -6px;">Quiz Completed</p>
    
    <div class="score-circle" id="user-score-badge">0/8</div>
    <p id="score-comment" style="text-align: center; font-weight: 600; color: #702082; margin-bottom: 20px;"></p>

    <div id="score-details" style="max-height: 250px; overflow-y: auto; border: 1px solid #f1f5f9; border-radius: 8px;"></div>
  </div>

  <script>
    // 1. FIREBASE CONFIGURATION
    const firebaseConfig = { databaseURL: "https://wtw-quizroadshow2026-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. THE 8 QUESTIONS
    const questions = [
      {
        q: "What is the simple rule repeatedly emphasized throughout the presentation?",
        options: ["Trust but verify", "Pause. Verify. Report.", "Report everything immediately", "AI is always correct"],
        correctIndex: 1
      },
      {
        q: "Which of the following can AI make appear real?",
        options: ["Emails only", "Emails and phone calls only", "Emails, calls, videos, and messages", "Websites only"],
        correctIndex: 2
      },
      {
        q: "According to the presentation, what remains accountable when AI provides incorrect information?",
        options: ["The AI model vendor", "The chatbot", "The organization deploying the AI", "The customer"],
        correctIndex: 2
      },
      {
        q: "Which of the following was identified as a risk of AI agents?",
        options: ["Faster internet access", "Memory Poisoning", "Increased cloud storage", "Improved reporting"],
        correctIndex: 1
      },
      {
        q: "Why should AI-generated content be reviewed before use?",
        options: ["AI outputs may contain inaccuracies or bias", "AI content cannot be copied", "AI content is always encrypted", "AI automatically publishes information"],
        correctIndex: 0
      },
      {
        q: "What does \"Human-in-the-Loop\" mean in an AI environment?",
        options: ["AI operates with no human involvement", "Humans supervise and validate important AI decisions", "AI trains humans automatically", "Humans only maintain hardware"],
        correctIndex: 1
      },
      {
        q: "Why are AI agents often compared to privileged users?",
        options: ["They can perform actions and access systems on behalf of users", "They are faster than employees", "They never make mistakes", "They do not require monitoring"],
        correctIndex: 0
      },
      {
        q: "What is the greatest challenge organizations face when adopting AI agents?",
        options: ["Too many employees", "Balancing automation with security and oversight", "Lack of internet connectivity", "Excessive storage capacity"],
        correctIndex: 1
      }
    ];

    let currentQIndex = 0;
    let userName = localStorage.getItem("quiz_userName") || "";

    // Timer Variables
    let questionSecondsLeft = 15;
    let questionTimerInterval = null;
    let totalSecondsLeft = 120;
    let totalTimerInterval = null;

    // Session Management
    let localSessionId = localStorage.getItem("quiz_sessionId") || null;

    // Real-Time Invalidation Listener
    db.ref("session/sessionId").on("value", snapshot => {
      const serverSessionId = snapshot.val();
      if (!serverSessionId) return;

      const serverIdStr = String(serverSessionId);

      if (localSessionId && localSessionId !== serverIdStr) {
        // Detected a Reset event from presenter
        invalidateSession(serverIdStr);
      } else if (!localSessionId) {
        localSessionId = serverIdStr;
        localStorage.setItem("quiz_sessionId", localSessionId);
      }
    });

    function invalidateSession(newSessionId) {
      localSessionId = newSessionId;
      localStorage.setItem("quiz_sessionId", localSessionId);

      // Wipe all local answer cache
      for (let i = 0; i < questions.length; i++) {
        localStorage.removeItem(`quiz_voted_q_${i}`);
      }

      // Stop running intervals
      clearInterval(questionTimerInterval);
      clearInterval(totalTimerInterval);

      currentQIndex = 0;
      totalSecondsLeft = 120;
      questionSecondsLeft = 15;

      // Re-initialize voter screen
      if (userName) {
        document.getElementById("name-screen").style.display = "none";
        document.getElementById("poll-screen").style.display = "block";
        document.getElementById("summary-screen").style.display = "none";
        startTotalQuizTimer();
        renderQuestion(0);
        alert("The host has reset the quiz. Your questions have restarted!");
      } else {
        document.getElementById("name-screen").style.display = "block";
        document.getElementById("poll-screen").style.display = "none";
        document.getElementById("summary-screen").style.display = "none";
      }
    }

    if (userName) showPollScreen();

    function saveName() {
      const input = document.getElementById("username-input").value.trim();
      if (!input) return alert("Please enter your name.");
      userName = input;
      localStorage.setItem("quiz_userName", userName);
      showPollScreen();
    }

    function showPollScreen() {
      document.getElementById("name-screen").style.display = "none";
      document.getElementById("poll-screen").style.display = "block";
      document.getElementById("summary-screen").style.display = "none";
      startTotalQuizTimer();
      renderQuestion(currentQIndex);
    }

    function startTotalQuizTimer() {
      clearInterval(totalTimerInterval);
      totalTimerInterval = setInterval(() => {
        totalSecondsLeft--;
        const m = Math.floor(totalSecondsLeft / 60);
        const s = totalSecondsLeft % 60;
        document.getElementById("total-timer-label").innerText = `Total: ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

        if (totalSecondsLeft <= 0) {
          clearInterval(totalTimerInterval);
          clearInterval(questionTimerInterval);
          renderPersonalSummary();
        }
      }, 1000);
    }

    function startQuestionTimer() {
      clearInterval(questionTimerInterval);
      questionSecondsLeft = 15;
      document.getElementById("question-timer-label").innerText = `⏱ ${questionSecondsLeft}s remaining`;

      questionTimerInterval = setInterval(() => {
        questionSecondsLeft--;
        document.getElementById("question-timer-label").innerText = `⏱ ${questionSecondsLeft}s remaining`;

        if (questionSecondsLeft <= 0) {
          clearInterval(questionTimerInterval);
          handleTimeOut();
        }
      }, 1000);
    }

    function handleTimeOut() {
      if (!localStorage.getItem(`quiz_voted_q_${currentQIndex}`)) {
        submitVote(currentQIndex, "Timed Out (No Answer)", -1);
      }
    }

    function renderQuestion(idx) {
      if (idx >= questions.length) {
        clearInterval(totalTimerInterval);
        clearInterval(questionTimerInterval);
        renderPersonalSummary();
        return;
      }

      startQuestionTimer();

      const q = questions[idx];
      document.getElementById("mobile-q-tag").innerText = `CyberHub Question ${idx + 1} of ${questions.length}`;
      document.getElementById("mobile-q-text").innerText = q.q;

      const fbCorrect = document.getElementById("feedback-correct");
      const fbIncorrect = document.getElementById("feedback-incorrect");
      const nextBtn = document.getElementById("voter-next-btn");

      fbCorrect.style.display = "none";
      fbIncorrect.style.display = "none";
      nextBtn.style.display = "none";

      const box = document.getElementById("options-box");
      box.innerHTML = "";

      const savedAnswer = localStorage.getItem(`quiz_voted_q_${idx}`);

      q.options.forEach((opt, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.innerText = opt;

        if (savedAnswer) {
          btn.disabled = true;
          if (opt === savedAnswer) {
            btn.style.borderColor = "#702082";
            btn.style.background = "#fae8ff";
            btn.innerText = `● ${opt}`;
          } else {
            btn.style.opacity = "0.5";
          }
        } else {
          btn.onclick = () => submitVote(idx, opt, optIdx);
        }
        box.appendChild(btn);
      });

      if (savedAnswer) {
        clearInterval(questionTimerInterval);
        const isCorrect = (savedAnswer === q.options[q.correctIndex]);
        if (isCorrect) fbCorrect.style.display = "block";
        else fbIncorrect.style.display = "block";

        nextBtn.style.display = "block";
        nextBtn.innerText = (idx === questions.length - 1) ? "View Final Score →" : "Next Question →";
      }
    }

    function submitVote(qIdx, selectedOption, optIdx) {
      clearInterval(questionTimerInterval);
      const isCorrect = (optIdx === questions[qIdx].correctIndex);

      const responseRef = db.ref(`session/responses/q${qIdx}`).push();
      responseRef.set({
        userName: userName,
        answer: selectedOption,
        isCorrect: isCorrect,
        timestamp: Date.now()
      });

      localStorage.setItem(`quiz_voted_q_${qIdx}`, selectedOption);

      if (isCorrect) {
        document.getElementById("feedback-correct").style.display = "block";
      } else {
        document.getElementById("feedback-incorrect").style.display = "block";
      }

      const nextBtn = document.getElementById("voter-next-btn");
      nextBtn.style.display = "block";
      nextBtn.innerText = (qIdx === questions.length - 1) ? "View Final Score →" : "Next Question →";

      renderQuestion(qIdx);
    }

    function goToNextQuestion() {
      currentQIndex++;
      if (currentQIndex < questions.length) {
        renderQuestion(currentQIndex);
      } else {
        clearInterval(totalTimerInterval);
        clearInterval(questionTimerInterval);
        renderPersonalSummary();
      }
    }

    function renderPersonalSummary() {
      document.getElementById("poll-screen").style.display = "none";
      document.getElementById("summary-screen").style.display = "block";

      let score = 0;
      const detailsBox = document.getElementById("score-details");
      detailsBox.innerHTML = "";

      questions.forEach((q, idx) => {
        const userAnswer = localStorage.getItem(`quiz_voted_q_${idx}`);
        const correctAnswer = q.options[q.correctIndex];
        const isCorrect = (userAnswer === correctAnswer);

        if (isCorrect) score++;

        const item = document.createElement("div");
        item.className = "score-item";
        item.innerHTML = `
          <div>
            <strong>Q${idx + 1}</strong>: ${userAnswer ? userAnswer : '<em>Timed out / Unanswered</em>'}
          </div>
          <span class="status-badge ${isCorrect ? 'badge-correct' : 'badge-wrong'}">
            ${isCorrect ? 'Correct' : 'Review CyberHub'}
          </span>
        `;
        detailsBox.appendChild(item);
      });

      document.getElementById("user-score-badge").innerText = `${score}/${questions.length}`;

      let comment = "";
      if (score >= 7) comment = "Excellent work! Security champion level!";
      else if (score >= 5) comment = "Good effort! Check CyberHub for a quick refresher.";
      else comment = "Please visit CyberHub to review our cybersecurity policies.";

      document.getElementById("score-comment").innerText = comment;
    }
  </script>
</body>
</html>
