<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Presentation</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
      color: #111827;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Split: 75% Live Content | 25% QR Sidebar */
    .app-wrapper {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .main-presentation {
      width: 75vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 36px;
      overflow: hidden;
    }

    /* Fixed-budget Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-shrink: 0;
      min-height: 90px;
      max-height: 140px;
      margin-bottom: 12px;
    }
    .header-left {
      max-width: 78%;
    }
    .quiz-tag {
      font-size: clamp(0.8rem, 1vw, 1rem);
      color: #6b7280;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .question-title {
      font-size: clamp(1.3rem, 2vw, 2.2rem);
      font-weight: 800;
      color: #111827;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .controls button {
      padding: 8px 16px;
      background: #111827;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .controls button:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
    .btn-export { background: #059669 !important; }

    /* Rigid 2x2 Grid that strictly fills remaining viewport height */
    .grid-container {
      flex: 1;
      min-height: 0; /* CRITICAL: prevents child SVG growth from pushing rows down */
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 16px 48px;
      padding-bottom: 8px;
    }

    .quadrant {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    /* Absolute canvas wrapper keeps SVGs from dictating row heights */
    .canvas-box {
      flex: 1;
      min-height: 0;
      width: 100%;
      position: relative;
    }
    .canvas-box svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Quadrant Footer with line & count */
    .quadrant-footer {
      flex-shrink: 0;
      border-top: 2px solid #f3f4f6;
      padding-top: 8px;
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    .count-num {
      font-size: clamp(1.4rem, 2vw, 2rem);
      font-weight: 800;
      color: #1f2937;
      min-width: 35px;
    }
    .option-label {
      font-size: clamp(1rem, 1.4vw, 1.5rem);
      font-weight: 500;
      color: #111827;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Right 25% QR Sidebar */
    .qr-sidebar {
      width: 25vw;
      height: 100vh;
      background: #f8fafc;
      border-left: 2px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2vw;
      text-align: center;
      flex-shrink: 0;
    }
    .qr-card {
      background: #ffffff;
      padding: 1.5vw;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 300px;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 1.5vh 0;
    }
    #qrcode img {
      width: 100% !important;
      height: auto !important;
      max-width: 220px;
      max-height: 220px;
    }
    .qr-title {
      font-size: clamp(1.1rem, 1.4vw, 1.5rem);
      font-weight: 800;
      color: #0f172a;
      margin: 0;
    }
    .qr-subtitle {
      font-size: clamp(0.75rem, 0.85vw, 0.95rem);
      color: #64748b;
      margin-top: 4px;
    }

    /* Fullscreen Summary View */
    #summary-view {
      display: none;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      padding: 4vh 5vw;
      background: #fafafa;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 2vh;
      padding-bottom: 5vh;
    }
    .summary-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      padding: 20px;
      border-radius: 12px;
    }
    .summary-card h3 { font-size: 1rem; margin: 0 0 12px; color: #111827; }
    .metric-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.9rem; }
    .progress-bar-bg { background: #f3f4f6; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
    .progress-bar-fill { height: 100%; transition: width 0.6s ease; }
  </style>
</head>
<body>

  <div class="app-wrapper" id="live-presentation-wrapper">
    
    <div class="main-presentation">
      <header>
        <div class="header-left">
          <div class="quiz-tag" id="q-tag">Quiz Time. Q1 -</div>
          <div class="question-title" id="q-title">Loading Question...</div>
        </div>
        <div class="controls">
          <button id="prev-btn" onclick="prevQuestion()">Previous</button>
          <button id="next-btn" onclick="nextQuestion()">Next</button>
        </div>
      </header>

      <div class="grid-container" id="quiz-grid">
        <div class="quadrant">
          <div class="canvas-box" id="canvas-0"></div>
          <div class="quadrant-footer">
            <div class="count-num" id="count-0">0</div>
            <div class="option-label" id="label-0">Option One</div>
          </div>
        </div>
        <div class="quadrant">
          <div class="canvas-box" id="canvas-1"></div>
          <div class="quadrant-footer">
            <div class="count-num" id="count-1">0</div>
            <div class="option-label" id="label-1">Option Two</div>
          </div>
        </div>
        <div class="quadrant">
          <div class="canvas-box" id="canvas-2"></div>
          <div class="quadrant-footer">
            <div class="count-num" id="count-2">0</div>
            <div class="option-label" id="label-2">Option Three</div>
          </div>
        </div>
        <div class="quadrant">
          <div class="canvas-box" id="canvas-3"></div>
          <div class="quadrant-footer">
            <div class="count-num" id="count-3">0</div>
            <div class="option-label" id="label-3">Option Four</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right 25% QR Sidebar -->
    <div class="qr-sidebar">
      <div class="qr-card">
        <h3 class="qr-title">Scan to Vote</h3>
        <p class="qr-subtitle">Point your phone camera to join</p>
        <div id="qrcode"></div>
        <p class="qr-subtitle" style="font-weight: 600; color: #0284c7;">No App Install Needed</p>
      </div>
    </div>
  </div>

  <!-- Summary Screen -->
  <div id="summary-view">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h2 style="font-size: 2rem; margin: 0; font-weight: 800;">Executive Summary</h2>
        <span style="color: #6b7280; font-size: 1rem;" id="total-participants-label">Total participants: 0</span>
      </div>
      <div>
        <button id="summary-prev-btn" onclick="prevQuestion()" style="padding: 10px 18px; margin-right: 10px; border-radius: 8px; border: 1px solid #ccc; cursor: pointer;">← Back to Questions</button>
        <button class="btn-export" onclick="exportToExcel()" style="padding: 10px 18px; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">⬇ Export Results (.xlsx)</button>
      </div>
    </div>
    <div class="summary-grid" id="summary-cards-container"></div>
  </div>

  <script>
    // ================= 1. FIREBASE CONFIGURATION =================
    const firebaseConfig = { databaseURL: "https://wtw-quizroadshow2026-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ================= 2. 10 DUMMY QUESTIONS =================
    const questions = [
      {
        q: "What is the primary entry point for 90% of enterprise breaches?",
        options: ["Phishing Emails", "Zero-day Exploits", "Brute Force RDP", "Compromised USBs"]
      },
      {
        q: "Which cloud architecture pattern provides the strongest isolation?",
        options: ["Multi-Tenant Shared", "Single-Tenant VPC", "Serverless Functions", "Shared Database"]
      },
      {
        q: "What is the recommended frequency for rotating privileged service account keys?",
        options: ["Every 30-90 Days", "Once a Year", "Only on Breach", "Never if Complex"]
      },
      {
        q: "Which protocol is the modern standard for passwordless authentication?",
        options: ["FIDO2 / WebAuthn", "Kerberos", "NTLMv2", "SAML 1.1"]
      },
      {
        q: "Where should automated DAST security scanning run in your pipeline?",
        options: ["Staging Deployment", "Local Developer Machine", "Directly in Production", "Only Post-Incident"]
      },
      {
        q: "Which vulnerability type bypasses client-side firewalls to query internal servers?",
        options: ["SSRF (Server-Side)", "Cross-Site Scripting (XSS)", "SQL Injection", "Path Traversal"]
      },
      {
        q: "What is our team's biggest operational focus this quarter?",
        options: ["Cloud Security Posture", "CI/CD Pipeline Speed", "Mobile App UI", "API Modernization"]
      },
      {
        q: "What is the best defense against API authorization bypass (BOLA/IDOR)?",
        options: ["Object-Level Checks", "Basic HTTP Auth", "Obscure Query IDs", "WAF Rules Only"]
      },
      {
        q: "Which primary language should our automation team standardize on?",
        options: ["PowerShell", "Python", "Go", "TypeScript"]
      },
      {
        q: "Should interactive live polling become a standard part of all team meetings?",
        options: ["Yes, every meeting", "Bi-weekly syncs", "Monthly all-hands only", "Keep it as-is"]
      }
    ];

    const quadrantColors = ["#4f6bee", "#f87171", "#2e3b75", "#8c87ed"];
    let currentIndex = 0;
    let allSessionResponses = {};
    const clusterSimulations = [];
    const clusterData = [[], [], [], []];

    // High-Resolution QR Code
    const voteUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + "/vote.html";
    new QRCode(document.getElementById("qrcode"), { 
      text: voteUrl, 
      width: 220, 
      height: 220,
      correctLevel: QRCode.CorrectLevel.H 
    });

    db.ref("session/responses").on("value", snapshot => {
      allSessionResponses = snapshot.val() || {};
    });

    function initQuadrantSimulations() {
      clusterSimulations.forEach(sim => sim && sim.stop());
      clusterSimulations.length = 0;

      for (let i = 0; i < 4; i++) {
        clusterData[i] = [];
        const container = document.getElementById(`canvas-${i}`);
        container.innerHTML = "";
        
        // Exact bounding client measurement
        const rect = container.getBoundingClientRect();
        const width = rect.width || 250;
        const height = rect.height || 160;

        const svg = d3.select(`#canvas-${i}`)
          .append("svg")
          .attr("width", "100%")
          .attr("height", "100%")
          .attr("viewBox", `0 0 ${width} ${height}`);

        const color = quadrantColors[i];
        const dotRadius = Math.max(8, Math.min(15, width / 22));

        const sim = d3.forceSimulation(clusterData[i])
          .force("center", d3.forceCenter(width / 2, height / 2))
          .force("x", d3.forceX(width / 2).strength(0.09))
          .force("y", d3.forceY(height / 2).strength(0.09))
          .force("collide", d3.forceCollide(dotRadius + 1.5).iterations(3))
          .on("tick", () => {
            svg.selectAll("circle")
              .attr("cx", d => d.x)
              .attr("cy", d => d.y);
          });

        sim.svgRef = svg;
        sim.color = color;
        sim.width = width;
        sim.height = height;
        sim.dotRadius = dotRadius;
        clusterSimulations.push(sim);
      }
    }

    function updateCluster(quadrantIndex, targetCount) {
      const sim = clusterSimulations[quadrantIndex];
      if (!sim) return;
      const data = clusterData[quadrantIndex];
      const svg = sim.svgRef;

      while (data.length < targetCount) {
        data.push({
          id: data.length,
          x: (sim.width / 2) + (Math.random() - 0.5) * 30,
          y: (sim.height / 2) + (Math.random() - 0.5) * 30
        });
      }
      while (data.length > targetCount) {
        data.pop();
      }

      const circles = svg.selectAll("circle").data(data, d => d.id);

      circles.enter()
        .append("circle")
        .attr("r", 0)
        .attr("fill", sim.color)
        .attr("cx", d => d.x)
        .attr("cy", d => d.y)
        .transition()
        .duration(450)
        .ease(d3.easeBackOut)
        .attr("r", sim.dotRadius);

      circles.exit().transition().duration(200).attr("r", 0).remove();
      sim.nodes(data);
      sim.alpha(0.4).restart();
    }

    function loadQuestion(index) {
      currentIndex = index;
      if (index === questions.length) {
        showFinalSummary();
        return;
      }

      document.getElementById("live-presentation-wrapper").style.display = "flex";
      document.getElementById("summary-view").style.display = "none";
      document.getElementById("next-btn").innerText = (index === questions.length - 1) ? "View Summary →" : "Next";
      document.getElementById("prev-btn").disabled = (index === 0);

      document.getElementById("q-tag").innerText = `Quiz Time. Q${index + 1} -`;
      document.getElementById("q-title").innerText = questions[index].q;

      // Allow DOM to settle, then initialize simulations
      setTimeout(() => {
        initQuadrantSimulations();

        for (let i = 0; i < 4; i++) {
          document.getElementById(`label-${i}`).innerText = questions[index].options[i] || "";
          document.getElementById(`count-${i}`).innerText = "0";
        }

        db.ref("session/activeQuestion").set(index);
        listenForResponses(index);
      }, 50);
    }

    function listenForResponses(qIndex) {
      db.ref("session/responses").off();
      db.ref(`session/responses/q${qIndex}`).on("value", snapshot => {
        const responses = snapshot.val() || {};
        const qOptions = questions[qIndex].options;
        const counts = [0, 0, 0, 0];

        Object.values(responses).forEach(entry => {
          const matchIdx = qOptions.indexOf(entry.answer);
          if (matchIdx !== -1 && matchIdx < 4) {
            counts[matchIdx]++;
          }
        });

        for (let i = 0; i < 4; i++) {
          document.getElementById(`count-${i}`).innerText = counts[i];
          updateCluster(i, counts[i]);
        }
      });
    }

    function showFinalSummary() {
      db.ref("session/activeQuestion").set("finished");
      document.getElementById("live-presentation-wrapper").style.display = "none";
      document.getElementById("summary-view").style.display = "block";

      const container = document.getElementById("summary-cards-container");
      container.innerHTML = "";
      const uniqueVoters = new Set();

      questions.forEach((qObj, idx) => {
        const responses = allSessionResponses[`q${idx}`] || {};
        const responseList = Object.values(responses);
        const totalVotes = responseList.length;

        const tally = {};
        qObj.options.forEach(opt => tally[opt] = 0);
        responseList.forEach(r => {
          if (tally[r.answer] !== undefined) tally[r.answer]++;
          if (r.userName) uniqueVoters.add(r.userName);
        });

        const card = document.createElement("div");
        card.className = "summary-card";

        let metricsHtml = `<h3>Q${idx + 1}: ${qObj.q}</h3>`;
        qObj.options.forEach((opt, optIdx) => {
          const count = tally[opt] || 0;
          const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
          const color = quadrantColors[optIdx % quadrantColors.length];
          metricsHtml += `
            <div class="metric-row">
              <span style="font-weight: 500;">${opt}</span>
              <strong>${count} (${pct}%)</strong>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${pct}%; background: ${color};"></div>
            </div>
          `;
        });

        card.innerHTML = metricsHtml;
        container.appendChild(card);
      });

      document.getElementById("total-participants-label").innerText = `Total participants: ${uniqueVoters.size}`;
    }

    function exportToExcel() {
      const summaryRows = [];
      const detailedRows = [];

      questions.forEach((qObj, idx) => {
        const responses = allSessionResponses[`q${idx}`] || {};
        const responseList = Object.values(responses);
        const totalVotes = responseList.length;

        const tally = {};
        qObj.options.forEach(opt => tally[opt] = 0);
        responseList.forEach(r => {
          if (tally[r.answer] !== undefined) tally[r.answer]++;
          detailedRows.push({
            "Question ID": `Q${idx + 1}`,
            "Question": qObj.q,
            "Participant Name": r.userName || "Anonymous",
            "Selected Answer": r.answer,
            "Timestamp": r.timestamp ? new Date(r.timestamp).toLocaleString() : "N/A"
          });
        });

        qObj.options.forEach(opt => {
          const count = tally[opt] || 0;
          const pct = totalVotes > 0 ? ((count / totalVotes) * 100).toFixed(1) + "%" : "0%";
          summaryRows.push({
            "Question ID": `Q${idx + 1}`,
            "Question": qObj.q,
            "Option": opt,
            "Votes": count,
            "Percentage": pct,
            "Total Responses": totalVotes
          });
        });
      });

      const wb = XLSX.utils.book_new();
      const wsSummary = XLSX.utils.json_to_sheet(summaryRows);
      const wsDetailed = XLSX.utils.json_to_sheet(detailedRows);

      XLSX.utils.book_append_sheet(wb, wsSummary, "Overview Summary");
      XLSX.utils.book_append_sheet(wb, wsDetailed, "Individual Responses");

      XLSX.writeFile(wb, `Quiz_Responses_${new Date().toISOString().slice(0, 10)}.xlsx`);
    }

    function nextQuestion() { if (currentIndex <= questions.length - 1) loadQuestion(currentIndex + 1); }
    function prevQuestion() { if (currentIndex > 0) loadQuestion(currentIndex - 1); }

    window.addEventListener("resize", () => {
      if (document.getElementById("live-presentation-wrapper").style.display !== "none") {
        initQuadrantSimulations();
        listenForResponses(currentIndex);
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      loadQuestion(0);
    });
  </script>
</body>
</html>
