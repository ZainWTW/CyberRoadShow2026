<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WTW CyberHub Quiz Presentation</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
      color: #111827;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-wrapper {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Left 75%: Presentation Area */
    .main-presentation {
      width: 75vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 40px;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-shrink: 0;
      height: 100px;
      max-height: 100px;
      overflow: hidden;
    }
    .header-left {
      max-width: 78%;
      height: 100%;
      overflow: hidden;
    }
    .quiz-tag {
      font-size: 0.9rem;
      color: #702082; /* WTW Purple */
      font-weight: 700;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .question-title {
      font-size: clamp(1.2rem, 1.8vw, 2.1rem);
      font-weight: 800;
      color: #111827;
      letter-spacing: -0.02em;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      align-items: center;
    }
    .controls button {
      padding: 9px 16px;
      background: #702082;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .controls button:hover:not(:disabled) { background: #561864; }
    .controls button:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
    
    .btn-reveal {
      background: #10b981 !important;
    }
    .btn-reveal:hover { background: #059669 !important; }
    .btn-reset {
      background: #ef4444 !important;
    }
    .btn-reset:hover { background: #dc2626 !important; }
    .btn-export { background: #702082 !important; }

    /* 2x2 Grid View with Visual Separator Lines */
    .grid-container {
      flex: 1;
      height: calc(100vh - 150px);
      max-height: calc(100vh - 150px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: calc(50% - 1px) calc(50% - 1px);
      overflow: hidden;
      margin-top: 10px;
      position: relative;
    }

    /* Quadrant border separator crosshair */
    #quad-0 {
      border-right: 1.5px solid #e5e7eb;
      border-bottom: 1.5px solid #e5e7eb;
      padding: 10px 28px 14px 10px;
    }
    #quad-1 {
      border-bottom: 1.5px solid #e5e7eb;
      padding: 10px 10px 14px 28px;
    }
    #quad-2 {
      border-right: 1.5px solid #e5e7eb;
      padding: 14px 28px 10px 10px;
    }
    #quad-3 {
      padding: 14px 10px 10px 28px;
    }

    .quadrant {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: relative;
      border-radius: 6px;
      transition: background-color 0.4s ease, opacity 0.4s ease;
    }

    /* Flashing Light Green state for correct answer */
    @keyframes pulseGreen {
      0% { background-color: rgba(134, 239, 172, 0.2); }
      50% { background-color: rgba(134, 239, 172, 0.65); box-shadow: 0 0 25px rgba(34, 197, 94, 0.35); }
      100% { background-color: rgba(134, 239, 172, 0.35); }
    }
    .quadrant.revealed-correct {
      animation: pulseGreen 1.5s infinite alternate ease-in-out;
      outline: 2px solid #22c55e;
      border-radius: 10px;
    }
    .quadrant.revealed-dimmed {
      opacity: 0.3;
    }

    .canvas-box {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .canvas-box svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    .quadrant-footer {
      flex-shrink: 0;
      height: 48px;
      border-top: 2px solid #f3f4f6;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .count-num {
      font-size: 1.8rem;
      font-weight: 800;
      color: #702082; /* WTW Purple Numbers */
      min-width: 35px;
    }
    .option-label {
      font-size: clamp(1rem, 1.3vw, 1.4rem);
      font-weight: 600;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 25% QR Sidebar */
    .qr-sidebar {
      width: 25vw;
      height: 100vh;
      background: #faf5ff; /* Soft WTW Tint */
      border-left: 2px solid #f3e8ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2vw;
      text-align: center;
      flex-shrink: 0;
    }
    .qr-card {
      background: #ffffff;
      padding: 1.6vw;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(112, 32, 130, 0.1);
      border: 1px solid #e9d5ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 300px;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 1.5vh 0;
    }
    #qrcode img {
      width: 100% !important;
      height: auto !important;
      max-width: 220px;
      max-height: 220px;
    }
    .qr-title {
      font-size: clamp(1.1rem, 1.4vw, 1.5rem);
      font-weight: 800;
      color: #702082;
      margin: 0;
    }
    .qr-subtitle {
      font-size: clamp(0.75rem, 0.85vw, 0.95rem);
      color: #6b7280;
      margin-top: 4px;
    }

    /* Summary Dashboard */
    #summary-view {
      display: none;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      padding: 4vh 5vw;
      background: #fafafa;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 2vh;
      padding-bottom: 5vh;
    }
    .summary-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      padding: 20px;
      border-radius: 12px;
    }
    .summary-card h3 { font-size: 1rem; margin: 0 0 12px; color: #702082; }
    .metric-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.9rem; }
    .progress-bar-bg { background: #f3f4f6; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
    .progress-bar-fill { height: 100%; transition: width 0.6s ease; }
  </style>
</head>
<body>

  <div class="app-wrapper" id="live-presentation-wrapper">
    <div class="main-presentation">
      <header>
        <div class="header-left">
          <div class="quiz-tag" id="q-tag">CyberHub Quiz. Q1 -</div>
          <div class="question-title" id="q-title">Loading Question...</div>
        </div>
        <div class="controls">
          <button id="prev-btn" onclick="prevQuestion()">Previous</button>
          <button id="reveal-btn" class="btn-reveal" onclick="toggleReveal()">Reveal Answer</button>
          <button id="next-btn" onclick="nextQuestion()">Next</button>
          <button id="reset-btn" class="btn-reset" onclick="resetAllVotes()">Reset</button>
        </div>
      </header>

      <div class="grid-container" id="quiz-grid">
        <div class="quadrant" id="quad-0">
          <div class="canvas-box" id="canvas-0"></div>
          <div class="quadrant-footer">
            <div class="count-num" id="count-0">0</div>
            <div class="option-label" id="label-0">Option One</div>
          </div>
        </div>
        <div class="quadrant" id="quad-1">
          <div class="canvas-box" id="canvas-1"></div>
          <div class="quadrant-footer">
            <div class="count-num" id="count-1">0</div>
            <div class="option-label" id="label-1">Option Two</div>
          </div>
        </div>
        <div class="quadrant" id="quad-2">
          <div class="canvas-box" id="canvas-2"></div>
          <div class="quadrant-footer">
            <div class="count-num" id="count-2">0</div>
            <div class="option-label" id="label-2">Option Three</div>
          </div>
        </div>
        <div class="quadrant" id="quad-3">
          <div class="canvas-box" id="canvas-3"></div>
          <div class="quadrant-footer">
            <div class="count-num" id="count-3">0</div>
            <div class="option-label" id="label-3">Option Four</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 25% QR Sidebar -->
    <div class="qr-sidebar">
      <div class="qr-card">
        <h3 class="qr-title">Scan to Join</h3>
        <p class="qr-subtitle">Scan via mobile camera to vote</p>
        <div id="qrcode"></div>
        <p class="qr-subtitle" style="font-weight: 700; color: #702082;">WTW CyberHub</p>
      </div>
    </div>
  </div>

  <!-- Summary Screen -->
  <div id="summary-view">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h2 style="font-size: 2rem; margin: 0; font-weight: 800; color: #702082;">CyberHub Quiz Summary</h2>
        <span style="color: #6b7280; font-size: 1rem;" id="total-participants-label">Total participants: 0</span>
      </div>
      <div>
        <button id="summary-prev-btn" onclick="prevQuestion()" style="padding: 10px 18px; margin-right: 10px; border-radius: 8px; border: 1px solid #ccc; cursor: pointer;">← Back to Questions</button>
        <button class="btn-export" onclick="exportToExcel()" style="padding: 10px 18px; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">⬇ Export Results (.xlsx)</button>
      </div>
    </div>
    <div class="summary-grid" id="summary-cards-container"></div>
  </div>

  <script>
    // ================= 1. FIREBASE CONFIGURATION =================
    const firebaseConfig = { databaseURL: "https://wtw-quizroadshow2026-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ================= 2. 10 QUESTIONS WITH CORRECT ANSWER KEYS =================
    const questions = [
      {
        q: "What is the primary entry point for 90% of enterprise breaches?",
        options: ["Phishing Emails", "Zero-day Exploits", "Brute Force RDP", "Compromised USBs"],
        correctIndex: 0
      },
      {
        q: "Which cloud architecture pattern provides the strongest isolation?",
        options: ["Multi-Tenant Shared", "Single-Tenant VPC", "Serverless Functions", "Shared Database"],
        correctIndex: 1
      },
      {
        q: "What is the recommended frequency for rotating privileged service account keys?",
        options: ["Every 30-90 Days", "Once a Year", "Only on Breach", "Never if Complex"],
        correctIndex: 0
      },
      {
        q: "Which protocol is the modern standard for passwordless authentication?",
        options: ["FIDO2 / WebAuthn", "Kerberos", "NTLMv2", "SAML 1.1"],
        correctIndex: 0
      },
      {
        q: "Where should automated DAST security scanning run in your pipeline?",
        options: ["Staging Deployment", "Local Developer Machine", "Directly in Production", "Only Post-Incident"],
        correctIndex: 0
      },
      {
        q: "Which vulnerability type bypasses client-side firewalls to query internal servers?",
        options: ["SSRF (Server-Side)", "Cross-Site Scripting (XSS)", "SQL Injection", "Path Traversal"],
        correctIndex: 0
      },
      {
        q: "What is our team's biggest operational focus this quarter?",
        options: ["Cloud Security Posture", "CI/CD Pipeline Speed", "Mobile App UI", "API Modernization"],
        correctIndex: 0
      },
      {
        q: "What is the best defense against API authorization bypass (BOLA/IDOR)?",
        options: ["Object-Level Checks", "Basic HTTP Auth", "Obscure Query IDs", "WAF Rules Only"],
        correctIndex: 0
      },
      {
        q: "Which primary language should our automation team standardize on?",
        options: ["PowerShell", "Python", "Go", "TypeScript"],
        correctIndex: 0
      },
      {
        q: "Where should employees review WTW security policies and incident steps?",
        options: ["CyberHub", "External Forums", "Personal Notes", "Unverified Wiki"],
        correctIndex: 0
      }
    ];

    // WTW Brand Purple Tones for response dots
    const quadrantColors = ["#702082", "#8b2ca3", "#5c166d", "#a855f7"];

    let currentIndex = 0;
    let isRevealed = false;
    let allSessionResponses = {};
    let clusterSimulations = [null, null, null, null];
    let clusterData = [[], [], [], []];

    // QR Code
    const voteUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + "/vote.html";
    new QRCode(document.getElementById("qrcode"), { 
      text: voteUrl, 
      width: 220, 
      height: 220,
      colorDark : "#702082",
      colorLight : "#ffffff",
      correctLevel: QRCode.CorrectLevel.H 
    });

    db.ref("session/responses").on("value", snapshot => {
      allSessionResponses = snapshot.val() || {};
    });

    function initQuadrantSimulations() {
      for (let i = 0; i < 4; i++) {
        if (clusterSimulations[i]) {
          clusterSimulations[i].stop();
          clusterSimulations[i] = null;
        }
        clusterData[i] = [];
        const container = document.getElementById(`canvas-${i}`);
        while (container.firstChild) {
          container.removeChild(container.firstChild);
        }
      }

      for (let i = 0; i < 4; i++) {
        const container = document.getElementById(`canvas-${i}`);
        const width = container.clientWidth || 250;
        const height = container.clientHeight || 150;

        const svg = d3.select(container)
          .append("svg")
          .attr("width", "100%")
          .attr("height", "100%")
          .attr("viewBox", `0 0 ${width} ${height}`);

        const color = quadrantColors[i];
        const dotRadius = Math.max(8, Math.min(14, width / 24));

        const sim = d3.forceSimulation(clusterData[i])
          .force("center", d3.forceCenter(width / 2, height / 2))
          .force("x", d3.forceX(width / 2).strength(0.12))
          .force("y", d3.forceY(height / 2).strength(0.12))
          .force("collide", d3.forceCollide(dotRadius + 1.5).iterations(3))
          .on("tick", () => {
            svg.selectAll("circle")
              .attr("cx", d => d.x)
              .attr("cy", d => d.y);
          });

        sim.svgRef = svg;
        sim.color = color;
        sim.width = width;
        sim.height = height;
        sim.dotRadius = dotRadius;
        clusterSimulations[i] = sim;
      }
    }

    function updateCluster(quadrantIndex, targetCount) {
      const sim = clusterSimulations[quadrantIndex];
      if (!sim) return;
      const data = clusterData[quadrantIndex];
      const svg = sim.svgRef;

      while (data.length < targetCount) {
        data.push({
          id: data.length,
          x: (sim.width / 2) + (Math.random() - 0.5) * 30,
          y: (sim.height / 2) + (Math.random() - 0.5) * 30
        });
      }
      while (data.length > targetCount) {
        data.pop();
      }

      const circles = svg.selectAll("circle").data(data, d => d.id);

      circles.enter()
        .append("circle")
        .attr("r", 0)
        .attr("fill", sim.color)
        .attr("cx", d => d.x)
        .attr("cy", d => d.y)
        .transition()
        .duration(400)
        .ease(d3.easeBackOut)
        .attr("r", sim.dotRadius);

      circles.exit().remove();
      sim.nodes(data);
      sim.alpha(0.4).restart();
    }

    function clearRevealStyles() {
      isRevealed = false;
      document.getElementById("reveal-btn").innerText = "Reveal Answer";
      for (let i = 0; i < 4; i++) {
        const quad = document.getElementById(`quad-${i}`);
        quad.classList.remove("revealed-correct", "revealed-dimmed");
      }
    }

    function toggleReveal() {
      if (currentIndex >= questions.length) return;
      isRevealed = !isRevealed;

      const correctIdx = questions[currentIndex].correctIndex;
      const revealBtn = document.getElementById("reveal-btn");

      if (isRevealed) {
        revealBtn.innerText = "Hide Answer";
        for (let i = 0; i < 4; i++) {
          const quad = document.getElementById(`quad-${i}`);
          if (i === correctIdx) {
            quad.classList.add("revealed-correct");
            quad.classList.remove("revealed-dimmed");
          } else {
            quad.classList.add("revealed-dimmed");
            quad.classList.remove("revealed-correct");
          }
        }
      } else {
        clearRevealStyles();
      }
    }

    function loadQuestion(index) {
      currentIndex = index;
      clearRevealStyles();

      if (index === questions.length) {
        showFinalSummary();
        return;
      }

      document.getElementById("live-presentation-wrapper").style.display = "flex";
      document.getElementById("summary-view").style.display = "none";
      document.getElementById("next-btn").innerText = (index === questions.length - 1) ? "View Summary →" : "Next";
      document.getElementById("prev-btn").disabled = (index === 0);
      document.getElementById("reveal-btn").style.display = "inline-block";

      document.getElementById("q-tag").innerText = `CyberHub Quiz. Q${index + 1} -`;
      document.getElementById("q-title").innerText = questions[index].q;

      for (let i = 0; i < 4; i++) {
        document.getElementById(`label-${i}`).innerText = questions[index].options[i] || "";
        document.getElementById(`count-${i}`).innerText = "0";
      }

      initQuadrantSimulations();

      db.ref("session/activeQuestion").set(index);
      listenForResponses(index);
    }

    function listenForResponses(qIndex) {
      db.ref("session/responses").off();
      db.ref(`session/responses/q${qIndex}`).on("value", snapshot => {
        const responses = snapshot.val() || {};
        const qOptions = questions[qIndex].options;
        const counts = [0, 0, 0, 0];

        Object.values(responses).forEach(entry => {
          const matchIdx = qOptions.indexOf(entry.answer);
          if (matchIdx !== -1 && matchIdx < 4) {
            counts[matchIdx]++;
          }
        });

        for (let i = 0; i < 4; i++) {
          document.getElementById(`count-${i}`).innerText = counts[i];
          updateCluster(i, counts[i]);
        }
      });
    }

    function resetAllVotes() {
      const confirmReset = confirm("Reset all quiz responses to 0? This will clear all votes across all questions.");
      if (!confirmReset) return;

      db.ref("session/responses").remove()
        .then(() => {
          loadQuestion(0);
          alert("All responses have been reset to 0.");
        })
        .catch(err => alert("Error: " + err.message));
    }

    function showFinalSummary() {
      db.ref("session/activeQuestion").set("finished");
      document.getElementById("live-presentation-wrapper").style.display = "none";
      document.getElementById("summary-view").style.display = "block";
      document.getElementById("reveal-btn").style.display = "none";

      const container = document.getElementById("summary-cards-container");
      container.innerHTML = "";
      const uniqueVoters = new Set();

      questions.forEach((qObj, idx) => {
        const responses = allSessionResponses[`q${idx}`] || {};
        const responseList = Object.values(responses);
        const totalVotes = responseList.length;

        const tally = {};
        qObj.options.forEach(opt => tally[opt] = 0);
        responseList.forEach(r => {
          if (tally[r.answer] !== undefined) tally[r.answer]++;
          if (r.userName) uniqueVoters.add(r.userName);
        });

        const card = document.createElement("div");
        card.className = "summary-card";

        let metricsHtml = `<h3>Q${idx + 1}: ${qObj.q}</h3>`;
        qObj.options.forEach((opt, optIdx) => {
          const count = tally[opt] || 0;
          const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
          const isCorrect = (optIdx === qObj.correctIndex);
          const color = isCorrect ? "#22c55e" : "#702082";
          
          metricsHtml += `
            <div class="metric-row">
              <span style="font-weight: ${isCorrect ? '700' : '500'}; color: ${isCorrect ? '#15803d' : '#111827'};">
                ${opt} ${isCorrect ? '✓ (Correct)' : ''}
              </span>
              <strong>${count} (${pct}%)</strong>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${pct}%; background: ${color};"></div>
            </div>
          `;
        });

        card.innerHTML = metricsHtml;
        container.appendChild(card);
      });

      document.getElementById("total-participants-label").innerText = `Total participants: ${uniqueVoters.size}`;
    }

    function exportToExcel() {
      const summaryRows = [];
      const detailedRows = [];

      questions.forEach((qObj, idx) => {
        const responses = allSessionResponses[`q${idx}`] || {};
        const responseList = Object.values(responses);
        const totalVotes = responseList.length;

        const tally = {};
        qObj.options.forEach(opt => tally[opt] = 0);
        responseList.forEach(r => {
          if (tally[r.answer] !== undefined) tally[r.answer]++;
          const isCorrect = (r.answer === qObj.options[qObj.correctIndex]);

          detailedRows.push({
            "Question ID": `Q${idx + 1}`,
            "Question": qObj.q,
            "Participant Name": r.userName || "Anonymous",
            "Selected Answer": r.answer,
            "Is Correct?": isCorrect ? "CORRECT" : "INCORRECT",
            "Timestamp": r.timestamp ? new Date(r.timestamp).toLocaleString() : "N/A"
          });
        });

        qObj.options.forEach((opt, optIdx) => {
          const count = tally[opt] || 0;
          const pct = totalVotes > 0 ? ((count / totalVotes) * 100).toFixed(1) + "%" : "0%";
          summaryRows.push({
            "Question ID": `Q${idx + 1}`,
            "Question": qObj.q,
            "Option": opt,
            "Is Correct Answer": (optIdx === qObj.correctIndex) ? "YES" : "NO",
            "Votes": count,
            "Percentage": pct,
            "Total Responses": totalVotes
          });
        });
      });

      const wb = XLSX.utils.book_new();
      const wsSummary = XLSX.utils.json_to_sheet(summaryRows);
      const wsDetailed = XLSX.utils.json_to_sheet(detailedRows);

      XLSX.utils.book_append_sheet(wb, wsSummary, "Overview Summary");
      XLSX.utils.book_append_sheet(wb, wsDetailed, "Individual Responses");

      XLSX.writeFile(wb, `WTW_CyberHub_Quiz_Results_${new Date().toISOString().slice(0, 10)}.xlsx`);
    }

    function nextQuestion() { if (currentIndex <= questions.length - 1) loadQuestion(currentIndex + 1); }
    function prevQuestion() { if (currentIndex > 0) loadQuestion(currentIndex - 1); }

    window.addEventListener("resize", () => {
      if (document.getElementById("live-presentation-wrapper").style.display !== "none") {
        initQuadrantSimulations();
        listenForResponses(currentIndex);
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      loadQuestion(0);
    });
  </script>
</body>
</html>
